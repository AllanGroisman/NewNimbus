<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nimbus — temporariamente indisponível</title>
  <link rel="icon" href="/nimbus-icon-32.png">
  <!--
    Página de último recurso, servida pelo nginx quando nem o app carrega.
    Tudo inline de propósito: se o build do frontend sumiu, não dá pra contar
    com CSS ou JS externo.
  -->
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f7f9; color: #1a1a1a;
    }
    .card {
      max-width: 440px; width: 100%; text-align: center;
      background: #fff; border: 1px solid #e3e5e8; border-radius: 12px; padding: 32px 24px;
    }
    img { width: 48px; height: 48px; margin-bottom: 12px; }
    h1 { font-size: 19px; margin: 0 0 10px; }
    p { font-size: 14px; line-height: 1.55; margin: 0 0 22px; color: #5b6068; }
    button {
      padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 500; background: #4f46e5; color: #fff;
    }
    button:hover { background: #4338ca; }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #e8e9eb; }
      .card { background: #1e2127; border-color: #2f333b; }
      p { color: #9aa0aa; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/nimbus-icon-192.png" alt="Nimbus">
    <h1>O Nimbus está fora do ar por instantes</h1>
    <p>
      Não é problema no seu computador nem na sua conta — estamos com uma
      instabilidade momentânea. Suas campanhas e seus dados continuam salvos.
      Tente de novo em alguns minutos.
    </p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
