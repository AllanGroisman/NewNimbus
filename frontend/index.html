<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/nimbus-icon-32.png" />
    <link rel="apple-touch-icon" href="/nimbus-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#cd6f04" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nimbus</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Pinta a paleta antes do primeiro paint. A paleta é global e vem do
      // servidor, mas esperar a resposta faria a tela abrir na paleta padrão e
      // trocar de cor na frente do usuário. Aqui usamos o último valor
      // conhecido; o App corrige depois se o servidor discordar.
      try {
        var p = localStorage.getItem("nimbus_palette");
        if (p === "nimbus" || p === "laranja" || p === "classica") {
          document.documentElement.dataset.palette = p;
        }
      } catch (e) { /* modo privado: segue no padrão */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
