services:
  postgres:
    image: postgres:16-alpine
    container_name: nimbus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da raiz do projeto}
      POSTGRES_DB: nimbus
    # 127.0.0.1: só aceita conexão de dentro do servidor. Sem o prefixo o Docker
    # publica em 0.0.0.0 e o banco fica acessível pela internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nimbus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nimbus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env da raiz do projeto}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env da raiz do projeto}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - nimbus-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nimbus-pgdata:
  nimbus-redis:
