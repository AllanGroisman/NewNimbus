# Nimbus - nginx (HTTP only; certbot adiciona o bloco 443 depois)
#
# __FRONTEND_DIST__ é substituído pelo install.sh pelo path real do build
# (algo como /home/allan/NewNimbus/frontend/dist).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Alinhado com o express.json({ limit: "2mb" }) do server.js. Estava em 50M,
    # ou seja, o nginx bufferizava 50MB antes de o backend recusar com 413.
    client_max_body_size 2M;

    # Stripe webhook precisa do body cru (validação HMAC).
    # proxy_request_buffering off impede o nginx de bufferizar/modificar.
    location = /api/billing/webhook {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 30s;

        # Backend fora do ar: o nginx respondia a própria página HTML de erro
        # ("502 Bad Gateway"), e o frontend — que espera JSON — acabava
        # mostrando esse texto em inglês pro usuário.
        error_page 502 503 504 = @api_offline;
    }

    # Resposta de indisponibilidade no mesmo formato das outras respostas de
    # erro da API: { error, code }. O frontend reconhece o code e mostra a
    # faixa "Sem conexão com o Nimbus".
    #
    # De propósito SEM proxy_intercept_errors: assim isto só vale pros erros
    # que o próprio nginx gera (upstream recusando conexão, timeout). Os 502/503
    # que o backend responde de verdade — teste da Shopee, SMTP não configurado —
    # continuam chegando com a mensagem original, que é útil.
    location @api_offline {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 15 always;
        return 503 '{"error":"O Nimbus está temporariamente indisponível. Tente novamente em instantes.","code":"server_offline"}';
    }

    # Health — público (load balancer / monitoring). Encaminha o IP real: o
    # backend devolve só {status} pra quem vem de fora e o detalhe completo
    # (erros do banco, contagens de fila) apenas pra chamada local.
    location = /healthz {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        # A sonda de reconexão do frontend bate aqui: precisa de JSON também.
        error_page 502 503 504 = @api_offline;
    }

    # Métricas — NÃO público. Expõe nº de usuários, volume de mensagens,
    # latências e caminhos internos. O backend não autentica essa rota; a
    # premissa (documentada em server.js) é que o nginx restringe.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        access_log off;
    }

    # Frontend estático (Vite build)
    root __FRONTEND_DIST__;
    index index.html;

    # Se nem o index.html existir (build quebrado, dist removido no meio de um
    # deploy), o nginx mostrava a própria página de 404/500. offline.html é
    # servido do dist e não depende de JS nenhum.
    # 403 entra na lista porque é o que o nginx devolve pra "/" quando o
    # index.html não existe (ele tenta listar o diretório e recusa).
    error_page 403 404 500 502 503 504 /offline.html;
    location = /offline.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback — qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;

        # O helmet do backend só cobre respostas de /api/. O HTML sai pelo nginx,
        # e sem estes headers a página em si fica sem proteção nenhuma.
        # accounts.google.com é necessário: o index.html carrega o script do
        # login com Google. img-src libera https: por causa das fotos de produto.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src 'self' https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    }

    # Cache agressivo pros assets versionados (Vite gera hash no nome)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
