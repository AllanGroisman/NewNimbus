# Nimbus - nginx (HTTP only; certbot adiciona o bloco 443 depois)
#
# __FRONTEND_DIST__ é substituído pelo install.sh pelo path real do build
# (algo como /home/allan/NewNimbus/frontend/dist).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Uploads e imagens grandes do scraping
    client_max_body_size 50M;

    # Stripe webhook precisa do body cru (validação HMAC).
    # proxy_request_buffering off impede o nginx de bufferizar/modificar.
    location = /api/billing/webhook {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 30s;
    }

    # Health + métricas (load balancer / monitoring)
    location ~ ^/(healthz|metrics)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        access_log off;
    }

    # Frontend estático (Vite build)
    root __FRONTEND_DIST__;
    index index.html;

    # SPA fallback — qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo pros assets versionados (Vite gera hash no nome)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
